<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理 · 管理后台</title>
<style>
  /* ===== SaaS 风格：左侧导航 + 右侧内容区 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f4f6f9; height: 100vh;
         display: flex; overflow: hidden; }
  /* ---- 侧边栏 ---- */
  aside { width: 210px; background: #1f4e8c; color: #fff; flex-shrink: 0;
          display: flex; flex-direction: column; }
  aside .logo { padding: 18px 16px; font-size: 15px; font-weight: 600;
                border-bottom: 1px solid rgba(255,255,255,.15); }
  aside nav { flex: 1; padding: 10px 0; }
  aside nav a {
    display: block; padding: 11px 20px; color: rgba(255,255,255,.85);
    text-decoration: none; font-size: 14px;
  }
  aside nav a:hover { background: rgba(255,255,255,.1); }
  aside nav a.active { background: rgba(255,255,255,.18); border-left: 3px solid #fff; }
  aside .user-box { padding: 14px 16px; font-size: 13px;
                    border-top: 1px solid rgba(255,255,255,.15); }
  aside .user-box button {
    margin-top: 8px; background: rgba(255,255,255,.15); color: #fff;
    border: 1px solid rgba(255,255,255,.4); border-radius: 6px;
    padding: 4px 12px; cursor: pointer; font-size: 12px;
  }
  /* ---- 内容区 ---- */
  main { flex: 1; overflow-y: auto; padding: 24px 28px; }
  main h2 { font-size: 17px; color: #333; margin-bottom: 4px; }
  main .desc { font-size: 13px; color: #8a93a3; margin-bottom: 18px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .btn { background: #1f4e8c; color: #fff; border: none; border-radius: 6px;
         padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .btn:disabled { background: #9db4d4; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: #1f4e8c; border: 1px solid #c9d7ea; }
  .btn.danger { background: #fff; color: #c0392b; border: 1px solid #f5b7b1; }
  .btn.mini { padding: 4px 10px; font-size: 12px; }
  table { width: 100%; background: #fff; border-radius: 8px;
          border-collapse: collapse; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px;
           border-bottom: 1px solid #eef1f5; }
  th { background: #fafbfc; color: #5a6472; font-weight: 600; }
  tr:hover td { background: #f7faff; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.on  { background: #e8f5e9; color: #2e7d32; }
  .tag.off { background: #fdecec; color: #c0392b; }
  .ops { display: flex; gap: 6px; }
  #toast {
    display: none; position: fixed; top: 20px; right: 24px; z-index: 9;
    background: #333; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px;
  }
  #empty { display: none; text-align: center; color: #a5adb9; padding: 40px 0; font-size: 13px; }
</style>
</head>
<body>

<aside>
  <div class="logo">教务协作后台</div>
  <nav id="nav"></nav>
  <div class="user-box">
    <div id="user-name">-</div>
    <button onclick="logout()">退出登录</button>
  </div>
</aside>

<main>
  <h2>知识库管理</h2>
  <div class="desc">上传教务制度 / 培养方案文件（md 或 pdf），系统自动切片并向量化入库；停用或删除后立即从 AI 检索中剔除。</div>
  <div class="toolbar">
    <input type="file" id="file-input" accept=".md,.markdown,.pdf" style="display:none">
    <button class="btn" id="upload-btn">上传文档</button>
    <button class="btn ghost" onclick="loadDocs()">刷新列表</button>
    <span id="upload-status" style="font-size:13px;color:#8a93a3;"></span>
  </div>
  <table>
    <thead>
      <tr><th>ID</th><th>文件名</th><th>类型</th><th>版本</th><th>切片数</th>
          <th>状态</th><th>上传时间</th><th>操作</th></tr>
    </thead>
    <tbody id="doc-rows"></tbody>
  </table>
  <div id="empty">暂无文档，请先上传</div>
</main>

<div id="toast"></div>

<script>
/* ================================================================
 * 知识库管理页（原生 JS）
 * 接口：GET /documents、POST /upload、POST /documents/{id}/disable|enable、
 *       DELETE /documents/{id}；全部请求带 Authorization: Bearer <token>
 * ================================================================ */

/* ---------- 公共：JWT 与鉴权请求（每个后台页面都带这一段） ---------- */
function getToken() { return localStorage.getItem('zx_admin_token') || ''; }

/* 前端解析 JWT payload（只解码不验签，角色仅用于菜单展示；真正的权限校验在服务端） */
function parseJwt() {
  try {
    var part = getToken().split('.')[1];
    return JSON.parse(decodeURIComponent(escape(atob(part.replace(/-/g, '+').replace(/_/g, '/')))));
  } catch (e) { return null; }
}

/* 统一带 token 的 fetch：命中 1005（无权限/未登录）跳回登录页 */
function authFetch(url, options) {
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Authorization'] = 'Bearer ' + getToken();
  return fetch(url, options).then(function (resp) { return resp.json(); })
    .then(function (j) {
      if (j.code === '1005') { location.href = '/admin/login'; throw new Error(j.message); }
      return j;
    });
}

/* 各角色可见的导航项（与服务端权限矩阵一致；页面访问权最终由接口兜底） */
var NAV_ITEMS = [
  { href: '/admin/kb',     label: '知识库管理', roles: ['scheduler', 'director'] },
  { href: '/admin/prompt', label: '提示词模板', roles: ['scheduler', 'quality', 'director'] },
  { href: '/admin/audit',    label: '对话审计',   roles: ['quality', 'director'] },
  { href: '/admin/drafts',   label: '草稿确认',   roles: ['scheduler', 'director'] },
  { href: '/admin/handover', label: '交接单',     roles: ['scheduler', 'director'] }
];
var ROLE_LABEL = { scheduler: '排课专员', quality: '教学质量专员', director: '教务主任',
                   counselor: '辅导员', program_leader: '专业负责人', student: '学生' };

function initLayout(activeHref) {
  var payload = parseJwt();
  if (!payload) { location.href = '/admin/login'; return null; }
  document.getElementById('user-name').textContent =
    (ROLE_LABEL[payload.role] || payload.role) + ' · ' + payload.username;
  var html = '';
  NAV_ITEMS.forEach(function (it) {
    if (it.roles.indexOf(payload.role) > -1) {
      html += '<a href="' + it.href + '" class="' +
              (it.href === activeHref ? 'active' : '') + '">' + it.label + '</a>';
    }
  });
  document.getElementById('nav').innerHTML = html;
  return payload;
}

function logout() {
  localStorage.removeItem('zx_admin_token');
  location.href = '/admin/login';
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2600);
}

/* ---------- 本页业务：文档列表 / 上传 / 启停 / 删除 ---------- */
var uploadStatus = document.getElementById('upload-status');

function statusTag(status) {
  return status === 'active'
    ? '<span class="tag on">启用中</span>'
    : '<span class="tag off">已停用</span>';
}

function loadDocs() {
  authFetch('/api/admin/kb/documents').then(function (j) {
    if (j.code !== 0) { toast(j.message || '加载失败'); return; }
    var tbody = document.getElementById('doc-rows');
    tbody.innerHTML = '';
    document.getElementById('empty').style.display = j.data.items.length ? 'none' : 'block';
    j.data.items.forEach(function (d) {
      var tr = document.createElement('tr');
      var ops = d.status === 'active'
        ? '<button class="btn ghost mini" onclick="toggleDoc(' + d.id + ',\'disable\')">停用</button>'
        : '<button class="btn mini" onclick="toggleDoc(' + d.id + ',\'enable\')">启用</button>';
      ops += '<button class="btn danger mini" onclick="delDoc(' + d.id + ')">删除</button>';
      tr.innerHTML = '<td>' + d.id + '</td><td>' + d.filename + '</td><td>' + (d.doc_type || '-') +
        '</td><td>' + (d.version || '-') + '</td><td>' + d.chunk_count + '</td><td>' +
        statusTag(d.status) + '</td><td>' + (d.created_at || '') + '</td>' +
        '<td><div class="ops">' + ops + '</div></td>';
      tbody.appendChild(tr);
    });
  });
}

/* 上传：multipart 格式，字段名 file */
document.getElementById('upload-btn').addEventListener('click', function () {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', function () {
  var file = this.files[0];
  if (!file) return;
  var fd = new FormData();
  fd.append('file', file);
  uploadStatus.textContent = '上传并重建索引中…';
  authFetch('/api/admin/kb/upload', { method: 'POST', body: fd }).then(function (j) {
    uploadStatus.textContent = '';
    if (j.code === 0) { toast('上传成功，AI 检索已更新'); loadDocs(); }
    else toast('[' + j.code + '] ' + j.message);
  }).catch(function () { uploadStatus.textContent = ''; });
  this.value = '';                          // 清空 input，允许重复选同一文件
});

/* 停用 / 启用 */
function toggleDoc(id, action) {
  authFetch('/api/admin/kb/documents/' + id + '/' + action, { method: 'POST' })
    .then(function (j) {
      if (j.code === 0) { toast(j.message); loadDocs(); }
      else toast('[' + j.code + '] ' + j.message);
    });
}

/* 删除（二次确认防误删） */
function delDoc(id) {
  if (!confirm('确定删除该文档吗？删除后其全部切片退出 AI 检索。')) return;
  authFetch('/api/admin/kb/documents/' + id, { method: 'DELETE' })
    .then(function (j) {
      if (j.code === 0) { toast(j.message); loadDocs(); }
      else toast('[' + j.code + '] ' + j.message);
    });
}

/* 页面初始化：鉴权 → 渲染导航 → 拉列表 */
initLayout('/admin/kb');
loadDocs();
</script>
</body>
</html>
