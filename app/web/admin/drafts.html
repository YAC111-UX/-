<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>草稿确认 · 管理后台</title>
<style>
  /* ===== SaaS 风格：左侧导航 + 右侧内容区（与 kb.html 同款式） ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #f4f6f9; height: 100vh;
         display: flex; overflow: hidden; }
  aside { width: 210px; background: #1f4e8c; color: #fff; flex-shrink: 0;
          display: flex; flex-direction: column; }
  aside .logo { padding: 18px 16px; font-size: 15px; font-weight: 600;
                border-bottom: 1px solid rgba(255,255,255,.15); }
  aside nav { flex: 1; padding: 10px 0; }
  aside nav a { display: block; padding: 11px 20px; color: rgba(255,255,255,.85);
                text-decoration: none; font-size: 14px; }
  aside nav a:hover { background: rgba(255,255,255,.1); }
  aside nav a.active { background: rgba(255,255,255,.18); border-left: 3px solid #fff; }
  aside .user-box { padding: 14px 16px; font-size: 13px;
                    border-top: 1px solid rgba(255,255,255,.15); }
  aside .user-box button {
    margin-top: 8px; background: rgba(255,255,255,.15); color: #fff;
    border: 1px solid rgba(255,255,255,.4); border-radius: 6px;
    padding: 4px 12px; cursor: pointer; font-size: 12px;
  }
  main { flex: 1; overflow-y: auto; padding: 24px 28px; }
  main h2 { font-size: 17px; color: #333; margin-bottom: 4px; }
  main .desc { font-size: 13px; color: #8a93a3; margin-bottom: 18px; }
  .filters { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .filters select { padding: 6px 10px; border: 1px solid #d5dbe3; border-radius: 6px;
                    font-size: 13px; }
  .btn { background: #1f4e8c; color: #fff; border: none; border-radius: 6px;
         padding: 7px 18px; font-size: 13px; cursor: pointer; }
  .btn.ghost { background: #fff; color: #1f4e8c; border: 1px solid #c9d7ea; }
  .btn.mini { padding: 4px 12px; font-size: 12px; }
  .btn.danger { background: #fff; color: #c0392b; border: 1px solid #f5b7b1; }
  table { width: 100%; background: #fff; border-radius: 8px;
          border-collapse: collapse; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px;
           border-bottom: 1px solid #eef1f5; vertical-align: top; }
  th { background: #fafbfc; color: #5a6472; font-weight: 600; white-space: nowrap; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.pending  { background: #fff7e6; color: #b26b00; }
  .tag.confirmed { background: #e8f5e9; color: #2e7d32; }
  .tag.rejected { background: #fdecec; color: #c0392b; }
  .diff { font-family: Consolas, monospace; font-size: 12px; line-height: 1.9; }
  .diff .old { color: #c0392b; text-decoration: line-through; }
  .diff .new { color: #2e7d32; font-weight: 600; }
  .ops { display: flex; flex-direction: column; gap: 6px; }
  .src { font-size: 12px; color: #a5adb9; }
  #toast { display: none; position: fixed; top: 20px; right: 24px; z-index: 9;
           background: #333; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; }
  #empty { display: none; text-align: center; color: #a5adb9; padding: 40px 0; font-size: 13px; }
  #ro-tip { display: none; padding: 8px 12px; background: #fff7e6; color: #b26b00;
            border: 1px solid #ffe1ad; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>

<aside>
  <div class="logo">教务协作后台</div>
  <nav id="nav"></nav>
  <div class="user-box">
    <div id="user-name">-</div>
    <button onclick="logout()">退出登录</button>
  </div>
</aside>

<main>
  <h2>调课草稿确认</h2>
  <div class="desc">AI 起草的调课调整建议。确认后正式生效并写入审计签核记录；驳回需填写理由。草稿必须显示原记录。</div>
  <div id="ro-tip">当前角色为只读权限，仅可查看草稿；确认/驳回请使用排课专员账号。</div>
  <div class="filters">
    <select id="f-status" onchange="loadList()">
      <option value="">全部状态</option>
      <option value="pending_confirm">待确认</option>
      <option value="confirmed">已确认</option>
      <option value="rejected">已驳回</option>
    </select>
    <button class="btn ghost" onclick="loadList()">刷新</button>
  </div>
  <table>
    <thead>
      <tr><th style="width:150px;">业务编号 / 时间</th><th>调整明细（原值 → 新值）</th>
          <th style="width:130px;">状态 / 签核</th><th style="width:110px;">操作</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty">暂无草稿</div>
</main>

<div id="toast"></div>

<script>
/* ================================================================
 * 草稿确认页（原生 JS）
 * GET  /api/admin/drafts            列表（scheduler/director）
 * POST /api/admin/drafts/{id}/confirm  确认（仅 scheduler）
 * POST /api/admin/drafts/{id}/reject   驳回（仅 scheduler，理由必填）
 * ================================================================ */

/* ---------- 公共：JWT 与鉴权请求 ---------- */
function getToken() { return localStorage.getItem('zx_admin_token') || ''; }
function parseJwt() {
  try {
    var part = getToken().split('.')[1];
    return JSON.parse(decodeURIComponent(escape(atob(part.replace(/-/g, '+').replace(/_/g, '/')))));
  } catch (e) { return null; }
}
function authFetch(url, options) {
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Authorization'] = 'Bearer ' + getToken();
  if (options.body && !options.headers['Content-Type']) {
    options.headers['Content-Type'] = 'application/json';
  }
  return fetch(url, options).then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.code === '1005') { location.href = '/admin/login'; throw new Error(j.message); }
      return j;
    });
}
var NAV_ITEMS = [
  { href: '/admin/kb',       label: '知识库管理', roles: ['scheduler', 'director'] },
  { href: '/admin/prompt',   label: '提示词模板', roles: ['scheduler', 'quality', 'director'] },
  { href: '/admin/audit',    label: '对话审计',   roles: ['quality', 'director'] },
  { href: '/admin/drafts',   label: '草稿确认',   roles: ['scheduler', 'director'] },
  { href: '/admin/handover', label: '交接单',     roles: ['scheduler', 'director'] }
];
var ROLE_LABEL = { scheduler: '排课专员', quality: '教学质量专员', director: '教务主任' };
function initLayout(activeHref) {
  var payload = parseJwt();
  if (!payload) { location.href = '/admin/login'; return null; }
  document.getElementById('user-name').textContent =
    (ROLE_LABEL[payload.role] || payload.role) + ' · ' + payload.username;
  var html = '';
  NAV_ITEMS.forEach(function (it) {
    if (it.roles.indexOf(payload.role) > -1) {
      html += '<a href="' + it.href + '" class="' +
              (it.href === activeHref ? 'active' : '') + '">' + it.label + '</a>';
    }
  });
  document.getElementById('nav').innerHTML = html;
  return payload;
}
function logout() { localStorage.removeItem('zx_admin_token'); location.href = '/admin/login'; }
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2600);
}

/* ---------- 本页业务 ---------- */
var currentUser = initLayout('/admin/drafts');
var canOperate = currentUser && currentUser.role === 'scheduler';   // 操作权仅排课专员
if (!canOperate) document.getElementById('ro-tip').style.display = 'block';

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function statusTag(s) {
  var map = { pending_confirm: '待确认', confirmed: '已确认', rejected: '已驳回' };
  return '<span class="tag ' + s + '">' + (map[s] || s) + '</span>';
}

function loadList() {
  var st = document.getElementById('f-status').value;
  authFetch('/api/admin/drafts' + (st ? '?status=' + st : '')).then(function (j) {
    if (j.code !== 0) { toast('[' + j.code + '] ' + j.message); return; }
    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    document.getElementById('empty').style.display = j.data.items.length ? 'none' : 'block';
    j.data.items.forEach(function (d) {
      var tr = document.createElement('tr');
      // 调整明细：原值 → 新值 对比（审计要求显示原记录）
      var diffHtml = (d.adjustments || []).map(function (a) {
        return '<div class="diff">' + esc(a.target) + ' 的 ' + esc(a.field) + '：<br>' +
               '<span class="old">' + esc(a.old_value) + '</span> → ' +
               '<span class="new">' + esc(a.new_value) + '</span></div>';
      }).join('') + (d.reason ? '<div class="src">理由：' + esc(d.reason) + '</div>' : '');
      // 状态与签核信息
      var sign = statusTag(d.status);
      if (d.status === 'confirmed') {
        sign += '<div class="src">' + esc(d.confirmed_by_name || '') + '<br>' + esc(d.confirmed_at || '') + '</div>';
      } else if (d.status === 'rejected') {
        sign += '<div class="src">理由：' + esc(d.reject_reason || '') + '</div>';
      }
      // 操作按钮（仅待确认 + 排课专员）
      var ops = '';
      if (canOperate && d.status === 'pending_confirm') {
        ops = '<div class="ops">' +
              '<button class="btn mini" onclick="confirmDraft(' + d.id + ')">确认生效</button>' +
              '<button class="btn danger mini" onclick="rejectDraft(' + d.id + ')">驳回</button></div>';
      }
      var src = d.data_source === 'snapshot'
        ? '<div class="src">数据来源：快照 ' + esc(d.snapshot_at || '') + '</div>' : '';
      tr.innerHTML = '<td><b>' + esc(d.business_no) + '</b><br><span class="src">' +
        esc(d.created_at || '') + '</span>' + src + '</td>' +
        '<td>' + diffHtml + '</td><td>' + sign + '</td><td>' + ops + '</td>';
      tbody.appendChild(tr);
    });
  });
}

function confirmDraft(id) {
  if (!confirm('确认该草稿生效吗？确认后将写入正式记录并落签核人。')) return;
  authFetch('/api/admin/drafts/' + id + '/confirm', { method: 'POST' })
    .then(function (j) {
      if (j.code === 0) { toast(j.message); loadList(); }
      else toast('[' + j.code + '] ' + j.message);     // 1012 终态等
    });
}

function rejectDraft(id) {
  var reason = prompt('请填写驳回理由（必填）：');
  if (reason === null) return;                          // 用户取消
  authFetch('/api/admin/drafts/' + id + '/reject', {
    method: 'POST', body: JSON.stringify({ reason: reason })
  }).then(function (j) {
    if (j.code === 0) { toast(j.message); loadList(); }
    else toast('[' + j.code + '] ' + j.message);
  });
}

loadList();
</script>
</body>
</html>
